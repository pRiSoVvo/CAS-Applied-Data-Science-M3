[project]
name = "machine-learning"
version = "0.1.0"
description = "Course materials for machine learning and data analysis"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "hdbscan",
    "imageio",
    "ipykernel",
    "ipython",
    "ipywidgets",
    "matplotlib",
    "numpy",
    "packaging",
    "pandas",
    "pillow",
    "plotly",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "seaborn",
    "torch>=2.14.0",
    "umap-learn",
    "xgboost",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true